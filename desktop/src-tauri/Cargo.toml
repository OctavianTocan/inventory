[package]
name = "mymind-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
base64 = "0.22"
gtk = "0.18"
serde_json = "1"
webkit2gtk = "2.0.2"

[features]
# Plain `cargo build` then produces the production app (the Tauri CLI would otherwise pass this).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
