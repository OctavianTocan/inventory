[package]
name = "mm-worker"
description = "The Cloudflare Worker: the hosted libraries on Workers, Durable Objects and R2"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mm-js.workspace = true
mm-core.workspace = true
mm-ai.workspace = true
mm-feedback.workspace = true
ai-kit = { workspace = true, features = ["agents", "worker"] }
anyhow.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
sha2.workspace = true
subtle.workspace = true
url.workspace = true
worker = "0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys.workspace = true
wasm-streams = "0.7"
web-sys = { version = "0.3", features = ["console", "Request", "RequestInit", "RequestRedirect", "Response", "ResponseInit", "Headers", "ReadableStream", "ResponseType"] }

