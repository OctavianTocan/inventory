[package]
name = "mm-core"
description = "The library backend shared by the native server and the Cloudflare Worker"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
mm-js.workspace = true
mm-msgpack.workspace = true
ai-kit = { workspace = true, features = ["embed"] }
async-trait.workspace = true
futures-core.workspace = true
futures-util.workspace = true
getrandom.workspace = true
url.workspace = true
regex.workspace = true
indexmap.workspace = true
sha1.workspace = true
sha2.workspace = true
scrypt.workspace = true
rsa.workspace = true
subtle.workspace = true
image-webp.workspace = true
thumbhash.workspace = true

[dev-dependencies]
mm-test-support = { path = "../../test-support" }
mm-sqlite.workspace = true
futures-executor.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
