name: Android verify

on:
  # Every PR gets the same required check; a paths-filtered required check can remain pending forever.
  pull_request:
  push:
    branches: [main]
    paths:
      - android/**
      - deploy/android-release*
      - deploy/publish-android.sh
      - .github/workflows/android-*.yml
  workflow_call:
    inputs:
      revision:
        description: Exact commit to verify
        type: string
        required: true
      base:
        description: Commit to compare for an Android version increase
        type: string
        required: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.revision || github.sha }}
      - name: Require a new version for Android runtime changes
        env:
          BASE_REVISION: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REVISION" || "$BASE_REVISION" =~ ^0+$ ]]; then
            BASE_REVISION=$(git rev-parse HEAD^)
          fi
          python3 -B deploy/android-release.py gate --base "$BASE_REVISION" --head HEAD
      - name: Test Android release tooling
        run: python3 -B deploy/android-release-test.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
      - name: Install the project SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
      - name: Test and build the Android app
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2
